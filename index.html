/* ---- Ball hisoblash (sorovnoma_v1.md, „Ball hisoblash” va „Sifat belgilari”) ---- */
function formulaTogri(s){
 const n = String(s||"").replace(/\s+/g,"").toUpperCase().replace(/В/g,"B");
 const kerak = "B2,B3,B4,B5,B6";
 if(/^=(SUM|СУММ)\(B2:B6\)$/.test(n)) return true;
 const m = n.match(/^=(?:SUM|СУММ)\((.+)\)$/);
 if(m && m[1].split(/[;,]/).sort().join(",")===kerak) return true;
 return n[0]==="=" && n.slice(1).split("+").sort().join(",")===kerak;
}
function parolBall(s){
 s = String(s||"");
 const tur = [/[a-zа-яёўқғҳ]/,/[A-ZА-ЯЁЎҚҒҲ]/,/\d/,/[^\p{L}\d]/u].filter(r=>r.test(s)).length;
 const oddiy = /(12345|qwerty|password|parol|11111|abcde)/i.test(s);
 if(s.length>=12 && tur===4 && !oddiy) return 1;
 if(s.length>=8 && tur>=3 && !oddiy) return .5;
 return 0;
}
function topshiriqBall(a){
 const b = {};
 for(const e of E) b[e.id] = a[e.id]===0 ? 1 : 0;
 const bel = a.S1||[]; const xato = bel.some(i=>!SOXTA_XAT.includes(i)); const topdi = SOXTA_XAT.filter(i=>bel.includes(i)).length;
 b.S1 = xato ? 0 : topdi===2 ? 1 : topdi===1 ? .5 : 0;
 b.S2 = formulaTogri(a.S2) ? 1 : 0;
 b.S3 = a.S3_ball||0;
 b.S4 = a.S4===2 ? 1 : 0;
 const s5 = a.S5||{}; b.S5 = (s5.fayl===0?.5:0) + (s5.k1==="bcc"&&s5.k2==="bcc"?.5:0);
 return b;
}
const ort = x => x.reduce((s,v)=>s+v,0)/x.length;
function hisobla(a, yil){
 yil = yil || new Date().getFullYear();
 const tb = topshiriqBall(a);
 const soha = {}; for(const [s,ids] of Object.entries(SOHA)) soha[s] = 100*ort(ids.map(i=>tb[i]));
 const kirish = 100*ort(B.map(b=>b.w[a[b.id]] ?? 0));
 const konikma = ort(Object.values(soha));
 const foyd = 100*ort(F.map(f=>a[f.id]===0?1:0));
 const g = x => 1+99*x/100;
 const indeks = Math.cbrt(g(kirish)*g(konikma)*g(foyd));
 const ozbaho = 100*ort(CID.map(i=>a[i]??0))/3;
 const zid = (c,k)=> (a[c]>=2 && a[k]>=2) || (a[c]===0 && a[k]===0);
 const q4n = [zid("C8","K1"),zid("C12","K2"),zid("C4","K3"), Math.abs((yil-a.K4)-a.A1)>1].filter(Boolean).length;
 const q3n = ["D8","D9","D10"].filter(i=>a[i]===2).length;
 return {
  ball:{kirish,konikma,foyd,indeks,ozbaho,farq:ozbaho-konikma,soha,topshiriq:tb},
  belgi:{q1:a.DQ!==1, q3n, q3:q3n>=2, q4n, q4:q4n>=2, q5:new Set(CID.map(i=>a[i])).size===1}
 };
}

function el(tag, attrs, ...kids){
 const e = document.createElement(tag);
 for(const [k,v] of Object.entries(attrs||{})){
  if(k==="class") e.className=v; else if(k.startsWith("on")) e.addEventListener(k.slice(2),v);
  else if(v===true) e.setAttribute(k,""); else if(v!==false && v!=null) e.setAttribute(k,v);
 }
 for(const k of kids.flat()){ if(k==null||k===false) continue; e.append(k.nodeType?k:document.createTextNode(k)); }
 return e;
}
function aralash(n){ const p=[...Array(n).keys()]; for(let i=n-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[p[i],p[j]]=[p[j],p[i]];} return p; }
const st = {a:{}, i:0, ts:{}, kirdi:0, boshi:0, tartib:{}};

function savolKarta(it, opt){

 const chiz = () => { box.replaceChildren(...tart.map(i=>el("button",{class:"opt",type:"button","aria-pressed":String(st.a[it.id]===i),onclick:()=>{st.a[it.id]=i; if(opt.qayta) koʻrsat(); else {chiz(); yangila();}}}, it.o[i])),

 chiz(); k.append(box); return k;
}

/* ---- Boshqaruv koʻrinishi (#admin): faqat shu qurilmadagi sinov javoblari ---- */
function tekisla(y){ const o={id:y.id,versiya:y.versiya,vaqt:y.vaqt,sek:y.sek};
 for(const [k,v] of Object.entries(y.javob)) o[k] = (v&&typeof v==="object") ? JSON.stringify(v) : v;
 for(const [k,v] of Object.entries(y.ball)) if(typeof v==="number") o["b_"+k]=Math.round(v*100)/100;
 for(const [k,v] of Object.entries(y.ball.soha)) o["soha_"+k]=Math.round(v*100)/100;
 for(const [k,v] of Object.entries(y.ball.topshiriq)) o["t_"+k]=v;
 for(const [k,v] of Object.entries(y.belgi)) o[k]=typeof v==="boolean"?Number(v):v;
 for(const [k,v] of Object.entries(y.ekran_sek)) o["sek_"+k]=v; return o; }

 const q = v => v==null ? "" : /[",;\n]/.test(String(v)) ? '"'+String(v).replace(/"/g,'""')+'"' : String(v);
 return "﻿"+[ust.join(";"),...qator.map(r=>ust.map(u=>q(r[u])).join(";"))].join("\r\n"); }

}
